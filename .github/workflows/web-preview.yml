name: Validar e publicar prévia web
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: leve-preview
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Buscar código
        uses: actions/checkout@v4
      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar dependências
        run: npm install --no-audit --no-fund
      - name: Verificar TypeScript
        run: npm run typecheck
      - name: Exportar prévia
        run: npm run web:export
      - name: Desativar Jekyll
        run: touch dist/.nojekyll
      - name: Preparar Pages
        uses: actions/configure-pages@v5
      - name: Carregar artefato
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.publish.outputs.page_url }}
    steps:
      - name: Publicar GitHub Pages
        id: publish
        uses: actions/deploy-pages@v4
